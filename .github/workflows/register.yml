name: Register Docker Image On-Chain

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".github/workflows/register.yml"

jobs:
  register:
    name: Build, Export & Register
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          IMAGE_TAG="${{ github.repository }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .
          docker save "$IMAGE_TAG" -o image.tar
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Compute SHA256
        run: |
          SHA256=$(sha256sum image.tar | awk '{print $1}')
          echo "SHA256=$SHA256" >> $GITHUB_ENV
          echo "SHA256 of image.tar: $SHA256"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Register image on-chain
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: |
          node gateway/push.js "${{ env.IMAGE_TAG }}" image.tar

      - name: Summary
        run: |
          echo "### Image Registered On-Chain" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.IMAGE_TAG }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`${{ env.SHA256 }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract | \`${{ secrets.CONTRACT_ADDRESS }}\` |" >> $GITHUB_STEP_SUMMARY
